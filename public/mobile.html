<!DOCTYPE html>
<html>
<head>
    <title>Mobile Defuse Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; text-align: center; padding: 15px; margin: 0; }
        .container { max-width: 100%; margin: auto; }
        input, button { font-size: 18px; background: #000; color: #0f0; border: 2px solid #0f0; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin: 10px 0; background: #0f0; color: #000; font-weight: bold; cursor: pointer; }
        .bomb-section { border: 2px solid #333; padding: 15px; margin-bottom: 20px; border-radius: 8px; background: #222; }
        .status-defused { color: #2ecc71; font-weight: bold; font-size: 18px; }
        .status-exploded { color: #e74c3c; font-weight: bold; font-size: 18px; }
        
        .boxes-container { display: flex; justify-content: center; gap: 8px; margin: 15px 0; flex-wrap: wrap; }
        .code-box { width: 45px; height: 50px; text-align: center; font-size: 18px; font-weight: bold; border-radius: 5px; margin-bottom: 5px; }
        .change-team-btn { background: #333; color: #aaa; border: 1px solid #555; font-size: 14px; padding: 8px; margin-top: 15px; width: auto; display: inline-block; }
        
        #dashboard, #waitingScreen { display: none; }
        #loginScreen { margin-top: 50px; }
        #loginMessage { font-size: 18px; color: #f1c40f; margin-top: 20px; }
        #mobileTimer { font-size: 45px; font-weight: bold; color: #f1c40f; margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container" id="loginScreen">
        <h2>📟 BOMB DEFUSAL TERMINAL</h2>
        <p id="loginMessage">Please scan the QR code relevant to your team...</p>
    </div>

    <div class="container" id="waitingScreen">
        <h2 style="color: #f1c40f;">⏳ WAITING FOR ADMIN...</h2>
        <p>Wait until the match begins.</p>
        <button class="change-team-btn" onclick="logout()">🔄 Disconnect</button>
    </div>

    <div class="container" id="dashboard">
        <h2 id="teamNameDisplay">TEAM TERMINAL</h2>
        <div id="mobileTimer">20:00</div>
        <h3 style="color: white; margin-top: 5px;">Your Score: <span id="myScore" style="color: #3498db;">0</span></h3>

        <!-- BOMB 1 -->
        <div class="bomb-section" id="section-bomb1">
            <h3>💣 Bomb 1 (3 Errors)</h3>
            <p id="status-bomb1" style="color: #f1c40f;">Status: ACTIVE</p>
            <div id="input-area-bomb1">
                <div class="boxes-container">
                    <input type="number" class="code-box bomb1-box" placeholder="L1">
                    <input type="number" class="code-box bomb1-box" placeholder="L2">
                    <input type="number" class="code-box bomb1-box" placeholder="L3">
                </div>
                <button onclick="defuse('bomb1')">DEFUSE BOMB 1</button>
            </div>
        </div>

        <!-- BOMB 2 -->
        <div class="bomb-section" id="section-bomb2">
            <h3>💣 Bomb 2 (5 Errors)</h3>
            <p id="status-bomb2" style="color: #f1c40f;">Status: ACTIVE</p>
            <div id="input-area-bomb2">
                <div class="boxes-container">
                    <input type="number" class="code-box bomb2-box" placeholder="L1">
                    <input type="number" class="code-box bomb2-box" placeholder="L2">
                    <input type="number" class="code-box bomb2-box" placeholder="L3">
                    <input type="number" class="code-box bomb2-box" placeholder="L4">
                    <input type="number" class="code-box bomb2-box" placeholder="L5">
                </div>
                <button onclick="defuse('bomb2')">DEFUSE BOMB 2</button>
            </div>
        </div>

        <!-- BOMB 3 -->
        <div class="bomb-section" id="section-bomb3">
            <h3>💣 Bomb 3 (7 Errors)</h3>
            <p id="status-bomb3" style="color: #f1c40f;">Status: ACTIVE</p>
            <div id="input-area-bomb3">
                <div class="boxes-container">
                    <input type="number" class="code-box bomb3-box" placeholder="L1">
                    <input type="number" class="code-box bomb3-box" placeholder="L2">
                    <input type="number" class="code-box bomb3-box" placeholder="L3">
                    <input type="number" class="code-box bomb3-box" placeholder="L4">
                    <input type="number" class="code-box bomb3-box" placeholder="L5">
                    <input type="number" class="code-box bomb3-box" placeholder="L6">
                    <input type="number" class="code-box bomb3-box" placeholder="L7">
                </div>
                <button onclick="defuse('bomb3')">DEFUSE BOMB 3</button>
            </div>
        </div>

        <button class="change-team-btn" onclick="logout()">🔄 Disconnect</button>
    </div>

    <script>
        const socket = io();
        
        const teamList = [
            "Kubi.exe", "StackOverflow", "Everywhere 2.0", "BYTE KNIGHTS",
            "Pentabyte", "NoZero", "Invariants", "CacheMe", "Nexus", "FrostByte"
        ];

        const urlParams = new URLSearchParams(window.location.search);
        let paramTeam = urlParams.get('team');
        let matchedTeam = "";

        if (paramTeam) {
            const found = teamList.find(t => t.toLowerCase() === paramTeam.trim().toLowerCase());
            if (found) matchedTeam = found;
        }

        let myTeam = matchedTeam || localStorage.getItem('myTeam') || "";
        let currentGameState = 'waiting';

        window.onload = () => {
            if (myTeam !== "") {
                socket.emit('registerTeam', myTeam);
            } else {
                document.getElementById('loginMessage').innerText = "❌ Invalid Link! Please scan the correct QR code.";
                document.getElementById('loginMessage').style.color = "red";
            }
        };

        socket.on('loginSuccess', () => {
            localStorage.setItem('myTeam', myTeam);
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('teamNameDisplay').innerText = myTeam + " TERMINAL";
            
            if (currentGameState === 'waiting') {
                document.getElementById('waitingScreen').style.display = 'block';
            } else {
                document.getElementById('dashboard').style.display = 'block';
            }
        });

        socket.on('loginRejected', (msg) => {
            alert(msg);
            localStorage.removeItem('myTeam');
            myTeam = "";
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('waitingScreen').style.display = 'none';
            document.getElementById('loginMessage').innerText = "🔒 " + msg;
            document.getElementById('loginMessage').style.color = "red";
        });

        function formatTime(seconds) {
            if (seconds <= 0) return "00:00";
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        socket.on('gameState', (data) => {
            currentGameState = data.state;
            if(myTeam !== "" && document.getElementById('loginScreen').style.display === 'none') {
                if (currentGameState === 'waiting') {
                    document.getElementById('dashboard').style.display = 'none';
                    document.getElementById('waitingScreen').style.display = 'block';
                } else {
                    document.getElementById('waitingScreen').style.display = 'none';
                    document.getElementById('dashboard').style.display = 'block';
                }
            }
        });

        socket.on('timerUpdate', (elapsedTime) => {
            let left = Math.max(1200 - elapsedTime, 0);
            document.getElementById('mobileTimer').innerText = formatTime(left);
            if(left === 0) document.getElementById('mobileTimer').style.color = "red";
        });

        socket.on('updateState', (teams) => {
            if(!myTeam) return;
            const myTeamData = teams[myTeam];
            if(!myTeamData) return;

            document.getElementById('myScore').innerText = myTeamData.score;

            ['bomb1', 'bomb2', 'bomb3'].forEach(bomb => {
                const bombData = myTeamData[bomb];
                const statusText = document.getElementById('status-' + bomb);
                const inputArea = document.getElementById('input-area-' + bomb);
                
                if (bombData.status === 'defused') {
                    statusText.innerText = `🟢 DEFUSED! (Time: ${bombData.timeTaken})`;
                    statusText.className = "status-defused";
                    inputArea.style.display = "none";
                } else if (bombData.status === 'exploded') {
                    statusText.innerText = `🔴 EXPLODED! (Time: ${bombData.timeTaken})`;
                    statusText.className = "status-exploded";
                    inputArea.style.display = "none";
                } else {
                    statusText.innerText = `🟡 ACTIVE (Attempts left: ${2 - bombData.attempts})`;
                    inputArea.style.display = "block";
                }
            });
        });

        function logout() {
            localStorage.removeItem('myTeam');
            window.location.href = window.location.pathname; 
        }

        function defuse(bombId) {
            if (currentGameState !== 'playing') {
                alert("The game hasn't started yet!");
                return;
            }

            const inputs = document.querySelectorAll('.' + bombId + '-box');
            let values = [];
            for (let input of inputs) {
                if (input.value.trim() === "") {
                    alert("Please fill in all the boxes!");
                    return;
                }
                values.push(input.value.trim());
            }

            socket.emit('submitCode', { team: myTeam, bomb: bombId, codeArray: values });
            inputs.forEach(input => input.value = '');
        }

        // අලුතින් එකතු කළ Alert Message කේතය (English)
        socket.on('attemptFeedback', (data) => {
            if (data.team === myTeam) {
                if (data.status === 'wrong') {
                    alert(`❌ INCORRECT CODE!\n\nYou have correctly found ${data.correctCount} out of ${data.totalNeeded} blanks.\nYou have ${data.attemptsLeft} attempt(s) left.`);
                } else if (data.status === 'exploded') {
                    alert(`💥 BOMB EXPLODED!\n\nYour final attempt had ${data.correctCount} out of ${data.totalNeeded} correct blanks.`);
                } else if (data.status === 'defused') {
                    alert(`✅ BOMB DEFUSED!\n\nCongratulations! You successfully defused the bomb.`);
                }
            }
        });

    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Live Overseer Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f0ff;
            --neon-green: #39ff14;
            --neon-red: #ff003c;
            --neon-yellow: #fcee0a;
            --bg-dark: #030a11;
            --grid-color: rgba(0, 240, 255, 0.07);
        }

        /* Sci-Fi Grid Background */
        body { 
            background-color: var(--bg-dark); 
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--neon-cyan); 
            font-family: 'Share Tech Mono', monospace; 
            text-align: center; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; height: 100vh; 
            overflow: hidden;
        }

        /* Top Bar & Typography */
        #top-bar { padding: 10px 20px 20px; background: rgba(0, 0, 0, 0.6); border-bottom: 2px solid var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
        
        .micro-text { font-size: 11px; display: flex; justify-content: space-between; color: #05828c; letter-spacing: 2px; margin-bottom: 5px; }
        
        h1 { margin: 5px 0 15px; font-family: 'Orbitron', sans-serif; font-size: 42px; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan); }
        .tri { color: var(--neon-green); font-size: 30px; vertical-align: middle; text-shadow: 0 0 10px var(--neon-green); }
        
        h2 { font-family: 'Orbitron', sans-serif; font-size: 28px; border-bottom: 1px solid rgba(0, 240, 255, 0.4); padding-bottom: 10px; margin-top: 0; letter-spacing: 2px; text-transform: uppercase; }
        
        /* Timer Layout */
        .timer-label { font-size: 12px; color: var(--neon-green); letter-spacing: 4px; font-weight: bold; margin-bottom: 5px; }
        #timer-container { display: inline-block; border: 2px solid var(--neon-cyan); padding: 5px 30px; border-radius: 5px; background: rgba(0, 240, 255, 0.05); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3) inset, 0 0 15px rgba(0, 240, 255, 0.3); margin-bottom: 15px; }
        #timer { font-size: 65px; font-weight: bold; color: var(--neon-cyan); font-family: 'Orbitron', sans-serif; text-shadow: 0 0 15px var(--neon-cyan); line-height: 1; }
        
        /* Sci-Fi Buttons */
        .btn-group { display: flex; justify-content: center; gap: 20px; }
        button.control-btn { font-family: 'Orbitron', sans-serif; font-size: 16px; padding: 12px 30px; font-weight: bold; cursor: pointer; border: none; letter-spacing: 2px; background: rgba(0,0,0,0.7); transition: 0.3s; color: white; text-transform: uppercase; }
        #startBtn { border: 1px solid var(--neon-cyan); box-shadow: 0 0 10px rgba(0,240,255,0.4) inset; }
        #startBtn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }
        #resetBtn { border: 1px solid var(--neon-red); box-shadow: 0 0 10px rgba(255,0,60,0.4) inset; }
        #resetBtn:hover { background: var(--neon-red); color: #000; box-shadow: 0 0 20px var(--neon-red); }

        /* Main Layout */
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .grid-container { flex: 3; overflow-y: auto; padding: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; align-content: flex-start; }
        .leaderboard-container { flex: 1.2; background: rgba(0, 0, 0, 0.5); border-left: 2px solid var(--neon-cyan); padding: 25px; overflow-y: auto; box-shadow: -5px 0 15px rgba(0,240,255,0.1); }
        
        /* Hacker Team Cards */
        .team-card { background: rgba(3, 15, 25, 0.8); padding: 20px; width: 280px; border: 1px solid rgba(0, 240, 255, 0.3); position: relative; text-align: center; box-shadow: 0 0 10px rgba(0, 240, 255, 0.1); backdrop-filter: blur(4px); transition: 0.3s; border-radius: 4px; }
        .team-card:hover { border-color: var(--neon-cyan); box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
        .team-card h3 { margin-top: 0; margin-bottom: 10px; font-size: 26px; font-family: 'Orbitron', sans-serif; letter-spacing: 1px; color: #fff; }
        
        /* Bombs and Badges */
        .bomb { display: block; padding: 10px; margin: 8px 0; font-weight: bold; font-size: 16px; border-radius: 3px; letter-spacing: 1px; text-transform: uppercase; }
        .active { background: rgba(252, 238, 10, 0.1); border: 1px solid var(--neon-yellow); color: var(--neon-yellow); }
        .defused { background: rgba(57, 255, 20, 0.1); border: 1px solid var(--neon-green); color: var(--neon-green); }
        .exploded { background: rgba(255, 0, 60, 0.1); border: 1px solid var(--neon-red); color: var(--neon-red); text-shadow: 0 0 5px var(--neon-red); }
        
        .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 15px; border: 1px solid; }
        .online { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 8px var(--neon-green) inset; }
        .offline { border-color: #555; color: #888; }

        /* Hacker Leaderboard Items */
        .rank-item { background: rgba(0,0,0,0.6); padding: 15px 20px; margin: 12px 0; border: 1px solid rgba(0, 240, 255, 0.2); border-left: 5px solid var(--neon-cyan); display: flex; justify-content: space-between; align-items: center; font-size: 22px; transition: 0.3s; }
        .rank-item:hover { background: rgba(0, 240, 255, 0.1); }
        .rank-item.top1 { border-left-color: var(--neon-yellow); color: var(--neon-yellow); text-shadow: 0 0 8px var(--neon-yellow); font-size: 26px; border-top: 1px solid var(--neon-yellow); border-bottom: 1px solid var(--neon-yellow); }
        .rank-item.top2 { border-left-color: #bdc3c7; color: #bdc3c7; font-size: 24px; }
        .rank-item.top3 { border-left-color: #cd7f32; color: #cd7f32; font-size: 23px; }
        
        .info-btn { background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan); border-radius: 3px; width: 35px; height: 35px; cursor: pointer; font-size: 18px; margin-left: 15px; display: inline-flex; justify-content: center; align-items: center; transition: 0.3s; }
        .info-btn:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 10px var(--neon-cyan); }

        /* Sci-Fi Modal */
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(5px); }
        .modal-content { background-color: rgba(3, 15, 25, 0.95); margin: 8% auto; padding: 30px; border: 2px solid var(--neon-cyan); width: 65%; color: var(--neon-cyan); text-align: left; box-shadow: 0 0 30px rgba(0, 240, 255, 0.3); border-radius: 5px; }
        .modal-content h2 { font-size: 32px; color: #fff; text-shadow: 0 0 10px var(--neon-cyan); }
        .close { color: var(--neon-cyan); float: right; font-size: 35px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .close:hover { color: var(--neon-red); text-shadow: 0 0 10px var(--neon-red); }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 20px; font-family: 'Share Tech Mono', monospace; }
        th, td { border: 1px solid rgba(0, 240, 255, 0.3); padding: 15px; text-align: center; }
        th { background-color: rgba(0, 240, 255, 0.1); color: #fff; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; }
        .total-row { font-weight: bold; background-color: rgba(0, 240, 255, 0.05); font-size: 26px; color: var(--neon-yellow); text-shadow: 0 0 5px var(--neon-yellow); border-top: 2px solid var(--neon-yellow); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); border-left: 1px solid #222; }
        ::-webkit-scrollbar-thumb { background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
    </style>
</head>
<body>
    <div id="top-bar">
        <div class="micro-text">
            <span>● SYS-NET: ARCHON // ORBITAL DEPLOYMENT</span>
            <span>FREQ: 947.22 GHZ ⊗ QUANTUM LINK SYNCHRONIZED</span>
            <span>SEC-LVL: EXTRATERRESTRIAL</span>
        </div>
        
        <h1><span class="tri">▼</span> HACKATHON LIVE OVERSEER DASHBOARD <span class="tri">▼</span></h1>
        
        <div class="timer-label">TACHYON COLLAPSE CHRONOMETER</div>
        <div id="timer-container">
            <div id="timer">20:00</div>
        </div>
        
        <div class="btn-group">
            <button id="startBtn" class="control-btn" onclick="socket.emit('startGame')">▶ INITIALIZE MISSION</button>
            <button id="resetBtn" class="control-btn" onclick="socket.emit('resetGame')">🔄 PURGE & RE-SYNC</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="grid-container" id="teamsContainer"></div>
        <div class="leaderboard-container">
            <h2><span style="color:var(--neon-yellow); margin-right:8px;">⬡</span> GALACTIC HIERARCHY</h2>
            <div id="leaderboardList"></div>
        </div>
    </div>

    <!-- Score Breakdown Modal -->
    <div id="scoreModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTeamName">Team Score Breakdown</h2>
            <table>
                <thead>
                    <tr>
                        <th>Bomb</th>
                        <th>Correct Blanks</th>
                        <th>Base Score</th>
                        <th>Time Bonus</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="modalTableBody">
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        let globalTeamsData = {}; 
        
        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        socket.on('gameState', (data) => {
            let timeLeft = Math.max(1200 - data.time, 0);
            document.getElementById('timer').innerText = formatTime(timeLeft);
            if (data.state === 'finished') {
                document.getElementById('timer').innerText = "00:00 - TIME UP";
                document.getElementById('timer').style.color = "var(--neon-red)";
                document.getElementById('timer').style.textShadow = "0 0 15px var(--neon-red)";
                document.getElementById('timer-container').style.borderColor = "var(--neon-red)";
                document.getElementById('timer-container').style.boxShadow = "0 0 15px rgba(255,0,60,0.3) inset, 0 0 15px rgba(255,0,60,0.3)";
            } else {
                document.getElementById('timer').style.color = "var(--neon-cyan)";
                document.getElementById('timer').style.textShadow = "0 0 15px var(--neon-cyan)";
                document.getElementById('timer-container').style.borderColor = "var(--neon-cyan)";
                document.getElementById('timer-container').style.boxShadow = "0 0 15px rgba(0,240,255,0.3) inset, 0 0 15px rgba(0,240,255,0.3)";
            }
        });

        socket.on('timerUpdate', (elapsedTime) => {
            let timeLeft = Math.max(1200 - elapsedTime, 0);
            document.getElementById('timer').innerText = formatTime(timeLeft);
        });

        socket.on('updateState', (teams) => {
            globalTeamsData = teams; 
            
            const container = document.getElementById('teamsContainer');
            const lbList = document.getElementById('leaderboardList');
            container.innerHTML = '';
            lbList.innerHTML = '';

            const fixedTeamList = [
                "Kubi.exe", "StackOverflow", "BYTE KNIGHTS", "Pentabyte",
                "NoZero", "CacheMe", "Nexus", "FrostByte"
            ];

            fixedTeamList.forEach(teamName => {
                if(!teams[teamName]) return;
                
                let tData = teams[teamName];
                let isOnline = tData.online;
                let badgeClass = isOnline ? 'online' : 'offline';
                let badgeText = isOnline ? '● LINKED' : '○ OFFLINE';

                let html = `<div class="team-card">
                    <h3>${teamName}</h3>
                    <div class="status-badge ${badgeClass}">${badgeText}</div>`;
                
                ['bomb1', 'bomb2', 'bomb3'].forEach((b, i) => {
                    let status = tData[b].status;
                    let timeTxt = tData[b].timeTaken ? ` (${tData[b].timeTaken})` : '';
                    let text = status === 'active' ? `BOMB ${i+1} [ACTIVE]` : `${status.toUpperCase()}${timeTxt}`;
                    html += `<div class="bomb ${status}">${text}</div>`;
                });
                html += `</div>`;
                container.innerHTML += html;
            });

            let teamArray = [];
            for (let teamName in teams) {
                teamArray.push({ name: teamName, score: teams[teamName].score, data: teams[teamName] });
            }

            teamArray.sort((a, b) => b.score - a.score);

            teamArray.forEach((t, index) => {
                let rankClass = index === 0 ? 'top1' : (index === 1 ? 'top2' : (index === 2 ? 'top3' : ''));
                lbList.innerHTML += `
                    <div class="rank-item ${rankClass}">
                        <span>[0${index + 1}] ${t.name}</span>
                        <span>
                            ${t.score} 
                            <button class="info-btn" onclick="showScoreDetails('${t.name}')" title="System Log">ℹ</button>
                        </span>
                    </div>
                `;
            });
        });

        function showScoreDetails(teamName) {
            const team = globalTeamsData[teamName];
            if(!team) return;

            document.getElementById('modalTeamName').innerText = "SYSTEM LOG: " + teamName.toUpperCase();
            
            let tbody = document.getElementById('modalTableBody');
            tbody.innerHTML = '';
            let totalScore = 0;

            ['bomb1', 'bomb2', 'bomb3'].forEach((b, idx) => {
                let maxBlanks = (idx === 0) ? 3 : (idx === 1) ? 5 : 7;
                let bData = team[b];
                
                let row = `<tr>
                    <td style="color:var(--neon-cyan)">BOMB ${idx + 1} <br><small style="font-size:14px; opacity:0.8;">[${bData.status}]</small></td>
                    <td>${bData.correct} / ${maxBlanks}</td>
                    <td>${bData.base}</td>
                    <td>${bData.bonus}</td>
                    <td style="font-weight: bold; color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green);">${bData.total}</td>
                </tr>`;
                tbody.innerHTML += row;
                totalScore += bData.total;
            });

            tbody.innerHTML += `
                <tr class="total-row">
                    <td colspan="4" style="text-align: right; padding-right: 20px;">SYSTEM TOTAL_</td>
                    <td>${totalScore}</td>
                </tr>
            `;
            document.getElementById('scoreModal').style.display = "block";
        }

        function closeModal() { document.getElementById('scoreModal').style.display = "none"; }
        window.onclick = function(event) {
            let modal = document.getElementById('scoreModal');
            if (event.target == modal) { modal.style.display = "none"; }
        }
    </script>
</body>
</html>

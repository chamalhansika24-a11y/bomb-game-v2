<!DOCTYPE html>
<html>
<head>
    <title>Live Admin Dashboard</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        h1 { margin: 10px 0; }
        #top-bar { padding: 10px; background: #222; border-bottom: 2px solid #444; }
        
        .main-layout { display: flex; flex: 1; overflow: hidden; }
        .grid-container { flex: 3; overflow-y: auto; padding: 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; align-content: flex-start; }
        .leaderboard-container { flex: 1; background: #1a1a1a; border-left: 2px solid #444; padding: 20px; overflow-y: auto; }
        
        .team-card { background: #222; padding: 15px; border-radius: 10px; width: 230px; border: 1px solid #444; position: relative; text-align: center; }
        .team-card h3 { margin-top: 0; margin-bottom: 5px; }
        .bomb { display: block; padding: 8px; margin: 5px 0; border-radius: 5px; font-weight: bold; font-size: 14px; }
        
        .active { background: #f1c40f; color: black; }
        .defused { background: #2ecc71; color: black; }
        .exploded { background: #e74c3c; color: white; }
        
        .status-badge { font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .online { background: #2ecc71; color: black; }
        .offline { background: #555; color: #ccc; }

        button.control-btn { font-size: 18px; padding: 10px 20px; font-weight: bold; cursor: pointer; border: none; border-radius: 8px; margin: 5px; }
        #startBtn { background: #3498db; color: white; }
        #resetBtn { background: #e74c3c; color: white; }
        
        #timer { font-size: 60px; font-weight: bold; color: #f1c40f; font-family: monospace; }
        
        .rank-item { background: #333; padding: 10px; margin: 10px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 18px; border-left: 5px solid #3498db; }
        .rank-item.top1 { border-left-color: #f1c40f; background: #443a11; }
        .rank-item.top2 { border-left-color: #bdc3c7; background: #2c3135; }
        .rank-item.top3 { border-left-color: #cd7f32; background: #3a2512; }
        
        .info-btn { background: #34495e; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-size: 14px; margin-left: 10px; }
        .info-btn:hover { background: #2980b9; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); }
        .modal-content { background-color: #222; margin: 10% auto; padding: 20px; border: 2px solid #3498db; width: 50%; border-radius: 10px; color: white; text-align: left; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        th { background-color: #333; }
        .total-row { font-weight: bold; background-color: #1a1a1a; font-size: 18px; color: #f1c40f; }
    </style>
</head>
<body>
    <div id="top-bar">
        <h1>💣 HACKATHON LIVE DASHBOARD 💣</h1>
        <div id="timer">20:00</div>
        <button id="startBtn" class="control-btn" onclick="socket.emit('startGame')">▶ START GAME</button>
        <button id="resetBtn" class="control-btn" onclick="socket.emit('resetGame')">🔄 RESET GAME</button>
    </div>

    <div class="main-layout">
        <div class="grid-container" id="teamsContainer"></div>
        <div class="leaderboard-container">
            <h2>🏆 LEADERBOARD</h2>
            <div id="leaderboardList"></div>
        </div>
    </div>

    <!-- Score Breakdown Modal -->
    <div id="scoreModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTeamName">Team Score Breakdown</h2>
            <table>
                <thead>
                    <tr>
                        <th>Bomb</th>
                        <th>Correct Blanks</th>
                        <th>Base Score</th>
                        <th>Time Bonus</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="modalTableBody">
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        let globalTeamsData = {}; // දත්ත Popup එකට ගන්න ගබඩා කර තබා ගැනීම
        
        function formatTime(seconds) {
            let m = Math.floor(seconds / 60);
            let s = seconds % 60;
            return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
        }

        socket.on('gameState', (data) => {
            let timeLeft = Math.max(1200 - data.time, 0);
            document.getElementById('timer').innerText = formatTime(timeLeft);
            if (data.state === 'finished') {
                document.getElementById('timer').innerText = "00:00 - TIME UP!";
                document.getElementById('timer').style.color = "red";
            } else {
                document.getElementById('timer').style.color = "#f1c40f";
            }
        });

        socket.on('timerUpdate', (elapsedTime) => {
            let timeLeft = Math.max(1200 - elapsedTime, 0);
            document.getElementById('timer').innerText = formatTime(timeLeft);
        });

        socket.on('updateState', (teams) => {
            globalTeamsData = teams; // Update global data for Modal
            
            const container = document.getElementById('teamsContainer');
            const lbList = document.getElementById('leaderboardList');
            container.innerHTML = '';
            lbList.innerHTML = '';

            let teamArray = [];
            for (let teamName in teams) {
                teamArray.push({ name: teamName, score: teams[teamName].score, data: teams[teamName] });
            }

            teamArray.sort((a, b) => b.score - a.score);

            teamArray.forEach((t, index) => {
                let isOnline = t.data.online;
                let badgeClass = isOnline ? 'online' : 'offline';
                let badgeText = isOnline ? '🟢 Online' : '⚪ Offline';

                let html = `<div class="team-card">
                    <h3>${t.name}</h3>
                    <div class="status-badge ${badgeClass}">${badgeText}</div>`;
                
                ['bomb1', 'bomb2', 'bomb3'].forEach((b, i) => {
                    let status = t.data[b].status;
                    let timeTxt = t.data[b].timeTaken ? ` (${t.data[b].timeTaken})` : '';
                    let text = status === 'active' ? `BOMB ${i+1} (Active)` : `${status.toUpperCase()}${timeTxt}`;
                    html += `<div class="bomb ${status}">${text}</div>`;
                });
                html += `</div>`;
                container.innerHTML += html;

                let rankClass = index === 0 ? 'top1' : (index === 1 ? 'top2' : (index === 2 ? 'top3' : ''));
                lbList.innerHTML += `
                    <div class="rank-item ${rankClass}">
                        <span>#${index + 1} ${t.name}</span>
                        <span>
                            ${t.score} Pts 
                            <button class="info-btn" onclick="showScoreDetails('${t.name}')" title="View Breakdown">ℹ️</button>
                        </span>
                    </div>
                `;
            });
        });

        // Modal Functions
        function showScoreDetails(teamName) {
            const team = globalTeamsData[teamName];
            if(!team) return;

            document.getElementById('modalTeamName').innerText = teamName + " - Score Breakdown";
            
            let tbody = document.getElementById('modalTableBody');
            tbody.innerHTML = '';

            let totalScore = 0;

            ['bomb1', 'bomb2', 'bomb3'].forEach((b, idx) => {
                let maxBlanks = (idx === 0) ? 3 : (idx === 1) ? 5 : 7;
                let bData = team[b];
                
                let row = `<tr>
                    <td>Bomb ${idx + 1} <br><small>(${bData.status})</small></td>
                    <td>${bData.correct} / ${maxBlanks}</td>
                    <td>${bData.base}</td>
                    <td>${bData.bonus}</td>
                    <td style="font-weight: bold; color: #2ecc71;">${bData.total}</td>
                </tr>`;
                tbody.innerHTML += row;
                totalScore += bData.total;
            });

            tbody.innerHTML += `
                <tr class="total-row">
                    <td colspan="4" style="text-align: right; padding-right: 20px;">GRAND TOTAL:</td>
                    <td>${totalScore}</td>
                </tr>
            `;

            document.getElementById('scoreModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('scoreModal').style.display = "none";
        }

        // ක්ලික් කළ විට Popup එක වැසීම
        window.onclick = function(event) {
            let modal = document.getElementById('scoreModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
